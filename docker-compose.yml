# Uses the ready-made images from ghcr.io. To build from source yourself: see
# docker-compose.build.yml.
name: wolsels

services:
  backend:
    image: ${REGISTRY:-ghcr.io/hjeverts}/wolsels-backend:${BACKEND_TAG:-${TAG:-latest}}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Blends__MaxComponents: ${MAX_BLEND_COMPONENTS:-6}
      App__PublicUrl: ${WOLSELS_PUBLIC_URL:-}
      DataProtection__KeysPath: /data/keys
      # Accounts and security
      Auth__AllowRegistration: ${ALLOW_REGISTRATION:-true}
      Auth__AdminEmail: ${ADMIN_EMAIL:-}
      Auth__MaxFailedAccessAttempts: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      Auth__LockoutMinutes: ${LOGIN_LOCKOUT_MINUTES:-15}
      Auth__RateLimitPerMinute: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      Auth__RateLimitPerHour: ${AUTH_RATE_LIMIT_PER_HOUR:-60}
      Auth__PasswordResetPerIpPerHour: ${PASSWORD_RESET_PER_IP_PER_HOUR:-5}
      Auth__PasswordResetPerEmailPerHour: ${PASSWORD_RESET_PER_EMAIL_PER_HOUR:-3}
      # Mail server for "forgot password" (empty = disabled)
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Security: ${SMTP_SECURITY:-Auto}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Wolsels}
    volumes:
      - wolsels-data:/data


  frontend:
    image: ${REGISTRY:-ghcr.io/hjeverts}/wolsels-frontend:${FRONTEND_TAG:-${TAG:-latest}}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      # Only reachable from the server itself; the nginx on the server proxies to it.
      # (WOLSELS_API_PORT is the old name from the version without a frontend container.)
      - "127.0.0.1:${WOLSELS_PORT:-${WOLSELS_API_PORT:-8080}}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  wolsels-data:
