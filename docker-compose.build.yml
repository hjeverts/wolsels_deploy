# Builds the images from the source repos instead of pulling them from ghcr.io.
# Enable with, in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml
#   REGISTRY=wolsels
# ./scripts/update.sh then runs git pull in the source repos and rebuilds.
services:
  backend:
    build:
      context: ${BACKEND_CONTEXT:-../wolsels_backend}
  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../wolsels_frontend}
