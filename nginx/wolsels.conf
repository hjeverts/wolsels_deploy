# Site-configuratie voor de nginx die op de server draait.
# Kopieer naar /etc/nginx/sites-available/wolsels (of conf.d/wolsels.conf), pas server_name aan,
# en vraag een certificaat aan, bv.: certbot --nginx -d wolsels.streve.nl
#
# De Wolsels-container luistert op 127.0.0.1:8080 (WOLSELS_PORT in .env) en regelt zelf
# de Angular-routes en de doorverwijzing van /api naar de backend.

server {
    listen 80;
    listen [::]:80;
    server_name wolsels.streve.nl;

    client_max_body_size 1m;
    server_tokens off;

    # HTTPS afdwingen zodra certbot een certificaat heeft ingesteld (cookies worden dan als Secure verstuurd):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Alleen het echte IP van de bezoeker doorgeven (niet aanvullen op een meegestuurde, vervalsbare keten);
        # de pogingslimieten werken per IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
