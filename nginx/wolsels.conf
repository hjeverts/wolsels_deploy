# Site-configuratie voor Wolsels op de nginx van de server.
#
#   sudo cp nginx/wolsels.conf /etc/nginx/sites-available/wolsels
#   sudo ln -s /etc/nginx/sites-available/wolsels /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wolsels.streve.nl
#
# - De frontend staat als statische bestanden in /var/www/wolsels/current (scripts/deploy-frontend.sh).
# - De backend draait in Docker op 127.0.0.1:5080 (WOLSELS_API_PORT in .env).

server {
    listen 80;
    listen [::]:80;
    server_name wolsels.streve.nl;

    root /var/www/wolsels/current;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Beveiligingsheaders. Let op: een add_header in een location vervangt deze allemaal, daarom regelen de
    # locations hieronder caching met 'expires' in plaats van add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Zet aan zodra certbot HTTPS heeft ingesteld:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Alleen het echte IP van de bezoeker doorgeven, niet een (vervalsbare) meegestuurde keten:
        # de pogingslimieten van de backend werken per IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Bestandsnamen bevatten een hash; ze mogen lang gecachet worden.
    location ~* \.(?:js|css|woff2?|ico|svg|png|webp)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Angular-routes (bv. /mengsels/3) altijd naar index.html; die zelf niet cachen.
    # '=404' aan het eind: staat de frontend er (nog) niet, dan een 404 in plaats van een 500 door een
    # doorverwijzingslus. Oplossing in dat geval: ./scripts/deploy-frontend.sh
    location / {
        expires -1;
        try_files $uri $uri/ /index.html =404;
    }
}
