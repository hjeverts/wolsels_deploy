# Site configuration for Wolsels on the server's nginx.
#
#   sudo cp nginx/wolsels.conf /etc/nginx/sites-available/wolsels
#   sudo ln -s /etc/nginx/sites-available/wolsels /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wolsels.example.nl
#
# Everything goes to the Wolsels container on 127.0.0.1:<WOLSELS_PORT from .env>. It serves the app,
# forwards /api/ to the backend and sets the security headers (CSP etc.) itself.

server {
    listen 80;
    listen [::]:80;
    server_name wolsels.example.nl;

    server_tokens off;
    # Stock photos (already resized by the browser); the backend itself limits to ±2.3 MB.
    client_max_body_size 4m;

    # Enable once certbot has set up HTTPS (the session cookie is then sent as Secure):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # The port must match WOLSELS_PORT in .env.
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Only pass on the visitor's real IP (don't append to an incoming, forgeable chain);
        # the attempt limits work per IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
