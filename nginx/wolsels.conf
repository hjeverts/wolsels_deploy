# Site-configuratie voor Wolsels op de nginx van de server.
#
#   sudo cp nginx/wolsels.conf /etc/nginx/sites-available/wolsels
#   sudo ln -s /etc/nginx/sites-available/wolsels /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wolsels.streve.nl
#
# Alles gaat naar de Wolsels-container op 127.0.0.1:<WOLSELS_PORT uit .env>. Die serveert de app,
# stuurt /api/ door naar de backend en zet zelf de beveiligingsheaders (CSP e.d.).

server {
    listen 80;
    listen [::]:80;
    server_name wolsels.streve.nl;

    server_tokens off;
    client_max_body_size 1m;

    # Zet aan zodra certbot HTTPS heeft ingesteld (de sessiecookie wordt dan als Secure verstuurd):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # Poort moet gelijk zijn aan WOLSELS_PORT in .env.
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Alleen het echte IP van de bezoeker doorgeven (niet aanvullen op een meegestuurde, vervalsbare keten);
        # de pogingslimieten werken per IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
